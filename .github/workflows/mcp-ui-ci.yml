name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/**"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Repository-wide lint (advisory; existing baseline violations)
        continue-on-error: true
        run: bun run lint
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
